<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Festival marketing</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <style type="text/css">

  <![endif]-->
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; max-width: 100%; height: auto; }
    /* Pin Wallet badge geometry — do not let global img height:auto / max-width shrink them. */
    img.wallet-badge-img {
      max-width: none !important;
      height: 48px !important;
      vertical-align: middle !important;
    }
    .email-container { width: 100% !important; max-width: 600px !important; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .stack-col { display: block !important; width: 100% !important; max-width: 100% !important; }
      .stack-pad { padding-left: 16px !important; padding-right: 16px !important; }
      /* Maximize wallet column: cancel nested stack-pad; keep 8px clear space (Google 8 dp). */
      .wallet-section {
        margin-left: -16px !important;
        margin-right: -16px !important;
        padding-left: 8px !important;
        padding-right: 8px !important;
        box-sizing: border-box !important;
        text-align: center !important;
      }
      .wallet-btn { display: block !important; width: 100% !important; max-width: 100% !important; margin: 0 0 16px 0 !important; text-align: center !important; padding-left: 0 !important; padding-right: 0 !important; font-size: 0 !important; line-height: 0 !important; }
      .wallet-btn:last-child { margin-bottom: 0 !important; }
      .wallet-row, .wallet-row tbody, .wallet-row tr { display: block !important; width: 100% !important; }
      /* Never fluid-shrink below 48px — swap to official condensed Google asset instead.
         Hide/show the *link wrappers* so empty anchors cannot skew stack spacing. */
      .wallet-google-primary-link {
        display: none !important;
        mso-hide: all !important;
        max-height: 0 !important;
        overflow: hidden !important;
        width: 0 !important;
        height: 0 !important;
      }
      .wallet-google-condensed-link {
        display: inline-block !important;
        max-height: none !important;
        overflow: visible !important;
        width: auto !important;
        height: auto !important;
      }
      .wallet-google-primary {
        display: none !important;
      }
      .wallet-google-condensed {
        display: block !important;
      }
      .cta-yellow { padding-left: 24px !important; padding-right: 24px !important; }
      /* Flush outer pad on small screens so wallet can use full viewport width. */
      .outer-pad { padding-left: 0 !important; padding-right: 0 !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background-color:#f9f9f9;font-family:'Roboto', Arial, Helvetica, Tahoma, sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">Festival campaign message</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f9f9f9;margin:0;padding:0;width:100%;max-width:100%;table-layout:fixed;">
    <tr>
      <td align="center" class="outer-pad" style="padding:40px 16px;width:100%;max-width:100%;">
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #ebebeb;border-radius:8px;overflow:hidden;table-layout:fixed;">
          
    
    <tr>
      <td align="center" style="background-color:#ffffff;padding:28px 24px 12px 24px;">
        <img src="../assets/fixtures/festival-logo-sample.svg" alt="SAMPLE festival logo" width="200" height="80" style="display:block;width:200px;max-width:70%;height:auto;border:0;outline:none;margin:0 auto;" />
      </td>
    </tr>
    <tr>
      <td align="center" class="stack-pad" style="padding:24px 30px 16px 30px;background-color:#fff7f8;font-family:'Roboto', Arial, Helvetica, Tahoma, sans-serif;">
        <p style="margin:0;font-size:16px;line-height:1.6;color:#4d4c49;">Join us at Summer Music Festival 2026 — early-bird weekend passes are open. SAMPLE campaign body from organizer (author content).</p>
      </td>
    </tr>
    <tr>
      <td align="center" class="stack-pad" style="padding:8px 30px 32px 30px;background-color:#fff7f8;">
        <img src="../assets/fixtures/festival-image-sample.svg" alt="SAMPLE event image — not a live campaign asset" width="450" style="display:block;width:75%;max-width:450px;height:auto;border:0;margin:0 auto;" />
      </td>
    </tr>
    
    <tr>
      <td align="center" style="background-color:#777777;padding:20px 24px;font-family:Arial, Helvetica, 'Roboto', Tahoma, sans-serif;">
        <p style="margin:0 0 10px 0;font-size:14px;font-weight:700;color:#ffffff;">Powered by Eveenty</p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#ffffff;">
          Want to change how you receive these emails?<br>
          You can update your preferences<br>
          or <a href="https://example.com/preview/unsubscribe" style="color:#ffffff;text-decoration:underline;">unsubscribe</a> from this list.
        </p>
      </td>
    </tr>
  
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
